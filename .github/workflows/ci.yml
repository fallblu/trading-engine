name: CI

on:
  push:
    branches:
      - develop
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      persistra_latest_head:
        description: Run the nonrequired Persistra develop compatibility canary
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && !github.ref_protected) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: make bootstrap
      - run: make check

  environment-matrix:
    name: environment (${{ matrix.name }})
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: lowest-ubuntu
            runner: ubuntu-latest
            dependency-band: lowest
            target: dependency-band-check
            informational: false
          - name: highest-ubuntu
            runner: ubuntu-latest
            dependency-band: highest
            target: dependency-band-check
            informational: false
          - name: highest-macos
            runner: macos-15
            dependency-band: highest
            target: determinism-check
            informational: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.dependency-band }} dependency band
        run: ./scripts/bootstrap-development-environment "${{ matrix.dependency-band }}"
      - name: Run ${{ matrix.target }}
        run: make "${{ matrix.target }}"

  ocaml-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: make bootstrap
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocaml-coverage
          path: |
            _coverage/cobertura.xml
            _coverage/html
            _coverage/summary.txt
          if-no-files-found: error
          retention-days: 14

  persistra-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERSISTRA_COMPAT_REVISION: 2f8beeaab87f4c456f7040f327314afe67306a54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trading-engine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fallblu/persistra
          ref: ${{ env.PERSISTRA_COMPAT_REVISION }}
          path: persistra
      - name: Report Persistra compatibility revision
        working-directory: persistra
        run: |
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$PERSISTRA_COMPAT_REVISION"
          echo "Persistra compatibility revision: $actual_revision"
          printf '### Persistra compatibility\n\n`%s`\n' "$actual_revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
      - working-directory: trading-engine
        run: make bootstrap
      - working-directory: trading-engine
        run: make build
      - working-directory: persistra
        run: uv sync --group dev
      - working-directory: persistra
        env:
          PERSISTRA_TRADING_ENGINE_BINARY: ${{ github.workspace }}/trading-engine/_build/default/bin/main.exe
          PERSISTRA_TRADING_ENGINE_CONTRACT_DIR: ${{ github.workspace }}/trading-engine/contracts/v1
        run: uv run pytest --no-cov tests/integration/test_trading_engine.py

  persistra-latest-head:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.persistra_latest_head }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trading-engine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fallblu/persistra
          ref: develop
          path: persistra
      - name: Report Persistra canary revision
        working-directory: persistra
        run: |
          actual_revision="$(git rev-parse HEAD)"
          echo "Persistra latest-head canary revision: $actual_revision"
          printf '### Persistra latest-head canary\n\n`%s`\n' "$actual_revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: "5.5.0"
      - working-directory: trading-engine
        run: make bootstrap
      - working-directory: trading-engine
        run: make build
      - working-directory: persistra
        run: uv sync --group dev
      - working-directory: persistra
        env:
          PERSISTRA_TRADING_ENGINE_BINARY: ${{ github.workspace }}/trading-engine/_build/default/bin/main.exe
          PERSISTRA_TRADING_ENGINE_CONTRACT_DIR: ${{ github.workspace }}/trading-engine/contracts/v1
        run: uv run pytest --no-cov tests/integration/test_trading_engine.py
