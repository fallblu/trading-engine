name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv-schema
      - run: >-
          uv pip install --python .venv-schema/bin/python
          "jsonschema[format-nongpl]==4.26.0"
      - run: echo "$GITHUB_WORKSPACE/.venv-schema/bin" >> "$GITHUB_PATH"
      - run: opam install . --deps-only --with-test --locked
      - run: make check

  persistra-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: trading-engine
      - uses: actions/checkout@v4
        with:
          repository: fallblu/persistra
          ref: ${{ vars.PERSISTRA_COMPAT_REF || 'develop' }}
          path: persistra
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
      - working-directory: trading-engine
        run: opam install . --deps-only --with-test --locked
      - working-directory: trading-engine
        run: make build
      - working-directory: persistra
        run: uv sync --group dev
      - working-directory: persistra
        env:
          PERSISTRA_TRADING_ENGINE_BINARY: ${{ github.workspace }}/trading-engine/_build/default/bin/main.exe
          PERSISTRA_TRADING_ENGINE_CONTRACT_DIR: ${{ github.workspace }}/trading-engine/contracts/v1
        run: uv run pytest --no-cov tests/integration/test_trading_engine.py
