site_name: Trading Engine
site_description: Deterministic OCaml trading replay engine
site_url: https://fallblu.github.io/trading-engine/
repo_url: https://github.com/fallblu/trading-engine
repo_name: fallblu/trading-engine
edit_uri: edit/develop/
docs_dir: _build/documentation-source
site_dir: site
strict: true
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
nav:
  - Home: index.md
  - Project:
      - Architecture: docs/architecture.md
      - Execution model: docs/execution-model.md
      - Scenario and journal: docs/scenario.md
      - Diagnostics: docs/diagnostics.md
      - Persistra integration: docs/persistra.md
      - Security policy: SECURITY.md
  - Contracts:
      - Conformance corpus: contracts/conformance/README.md
      - CLI results:
          - Current v1: contracts/cli/v1/README.md
      - Diagnostics:
          - Current v1: contracts/diagnostic/v1/README.md
      - Scenario and journal:
          - Current v1: contracts/v1/README.md
      - External strategy:
          - Current v1: contracts/strategy/v1/README.md
  - API reference: docs/api-reference.md
  - Engineering:
      - Continuous integration: docs/continuous-integration.md
      - OCaml coverage: docs/coverage.md
      - Performance: docs/performance.md
      - Reducer property testing: docs/reducer-property-testing.md
      - Protocol fuzzing: docs/fuzzing.md
      - Documentation platform: docs/documentation-platform.md
      - Release artifacts: docs/release-artifacts.md
      - Security maintenance: docs/security-maintenance.md
      - Repository governance: docs/repository-governance.md
  - Contributing: CONTRIBUTING.md
  - Support: SUPPORT.md
  - Changelog: CHANGELOG.md
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
